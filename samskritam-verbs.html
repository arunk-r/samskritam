<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samskrutam">
<title>Samskrutam - Study</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f4f6fa; font-family: "Segoe UI", system-ui, sans-serif; color: #1d2330; }
  .card { background: #fff; width: min(620px, 94vw); border-radius: 14px; padding: 28px 26px;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center; }
  .count { color: #6b7385; font-size: 14px; margin-bottom: 14px; }
  .english { font-size: 38px; font-weight: 600; margin: 6px 0 18px; min-height: 46px; }
  .forms { text-align: left; min-height: 240px; margin-bottom: 18px; }
  .form { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
          padding: 8px 12px; border-bottom: 1px solid #edf0f5; }
  .form .label { color: #6b7385; font-size: 16px; flex: 0 0 190px; text-align: left; }
  .form .deva { font-family: "Nirmala UI", "Noto Sans Devanagari", "Mangal", sans-serif; font-size: 32px; font-weight: 700; }
  .form .iast { color: #3b6e3b; font-size: 20px; flex: 0 0 170px; text-align: right; }
  .form.present { background: #eef6ee; border-radius: 10px; padding: 14px 12px; border-bottom: 0; margin-bottom: 6px; }
  .form.present .label { font-weight: 700; color: #1d2330; font-size: 18px; }
  .form.present .deva { font-size: 48px; }
  .form.present .iast { font-size: 26px; font-weight: 700; }
  .prompt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px;
            border-bottom: 1px solid #edf0f5; cursor: pointer; }
  .prompt .label { color: #1d2330; font-size: 17px; font-weight: 600; flex: 0 0 190px; }
  .prompt .question { color: #1d2330; font-size: 17px; flex: 1; }
  .prompt .answer-box { flex: 0 0 240px; text-align: right; background: #fff7e0; border: 1px dashed #c9a227;
                        border-radius: 8px; padding: 6px 10px; color: #6b4e00; font-size: 17px; font-weight: 600; }
  .buttons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  button { font-size: clamp(12px, 2.4vw, 16px); padding: clamp(6px, 1.2vw, 10px) clamp(6px, 1.4vw, 16px); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; border-radius: 8px; cursor: pointer;
           background: #e7ebf3; color: #1d2330; }
  button.primary { background: #2d6cdf; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(0.96); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; font-weight: 600; }
  .tabs button.active { background: #2d6cdf; color: #fff; }
  .short { display: none; }
  @media (max-width: 420px) { .full { display: none; } .short { display: inline; } }
  .hint { color: #8a92a3; font-size: 13px; margin-top: 16px; }
  @media (max-width: 600px) {
    body { align-items: flex-start; }
    .card { width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none; padding: 20px 16px; box-sizing: border-box; }
    .english { font-size: 30px; }
    .form, .prompt { flex-direction: column; align-items: flex-start; gap: 4px; }
    .form .label, .prompt .label, .prompt .question { flex: none; }
    .form .iast { flex: none; text-align: left; font-size: 18px; }
    .form .deva { font-size: 28px; }
    .prompt .answer-box { flex: none; width: 100%; box-sizing: border-box; text-align: left; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="tabs">
    <button id="tab-words" class="active">Words</button>
    <button id="tab-rel">Relationships</button>
    <button id="tab-time">Time</button>
    <button id="tab-pron">Pronouns</button>
  </div>
  <div class="count" id="count"></div>
  <div class="english" id="english"></div>
  <div class="forms" id="forms"></div>
  <div class="buttons">
    <button id="prev"><span class="full">&larr; Previous</span><span class="short">&larr; Prev</span></button>
    <button class="primary" id="show"><span class="full">Show next form</span><span class="short">Show</span></button>
    <button class="primary" id="next"><span class="full">Next &rarr;</span><span class="short">Next &rarr;</span></button>
    <button id="restart"><span class="full">Restart</span><span class="short">Restart</span></button>
  </div>
  <div class="hint">Say each form aloud, then press Show for the next one. Keys: Space = Show next, &rarr; = Next card, &larr; = Previous card.</div>
</div>

<script>

const FORM_LABELS = [
  "Present (he/she/it)",
  "I (aham)",
  "we (vayam)",
  "Imperative (let him)",
  "Past, masculine",
  "Past, feminine",
  "Future",
  "Having done (ktvA/lyap)",
  "To do (tumun)"

const ACTIVE_FORMS = 6;

  { en: "goes", f: [["गच्छति","gachChati"],["गच्छामि","gachChAmi"],["गच्छामः","gachChAmaH"],["गच्छतु","gachChatu"],["गतवान्","gatavAn"],["गतवती","gatavatii"],["गमिष्यति","gamiShyati"],["गत्वा","gatvA"],["गन्तुम्","gantum"]] },
  { en: "comes", f: [["आगच्छति","AgachChati"],["आगच्छामि","AgachChAmi"],["आगच्छामः","AgachChAmaH"],["आगच्छतु","AgachChatu"],["आगतवान्","AgatavAn"],["आगतवती","Agatavatii"],["आगमिष्यति","AgamiShyati"],["आगत्य","Agatya"],["आगन्तुम्","Agantum"]] },
  { en: "reads", f: [["पठति","paThati"],["पठामि","paThAmi"],["पठामः","paThAmaH"],["पठतु","paThatu"],["पठितवान्","paThitavAn"],["पठितवती","paThitavatii"],["पठिष्यति","paThiShyati"],["पठित्वा","paThitvA"],["पठितुम्","paThitum"]] },
  { en: "plays", f: [["क्रीडति","kriiDati"],["क्रीडामि","kriiDAmi"],["क्रीडामः","kriiDAmaH"],["क्रीडतु","kriiDatu"],["क्रीडितवान्","kriiDitavAn"],["क्रीडितवती","kriiDitavatii"],["क्रीडिष्यति","kriiDiShyati"],["क्रीडित्वा","kriiDitvA"],["क्रीडितुम्","kriiDitum"]] },
  { en: "writes", f: [["लिखति","likhati"],["लिखामि","likhAmi"],["लिखामः","likhAmaH"],["लिखतु","likhatu"],["लिखितवान्","likhitavAn"],["लिखितवती","likhitavatii"],["लेखिष्यति","lekhiShyati"],["लिखित्वा","likhitvA"],["लेखितुम्","lekhitum"]] },

// Fisher-Yates: random order, each verb exactly once per pass.
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Tabs share one card. Each tab has its own list and position.
const TABS = {
  words: { items: VERBS, active: ACTIVE_FORMS, label: i => FORM_LABELS[i], word: "verb" },
  rel:   { items: RELS,  active: 1,            label: i => "Sanskrit",     word: "term" },
  time:  { items: TIME,  active: 1,            label: i => "Sanskrit",     word: "term" },
  pron:  { items: VERBS, active: PRON_CELLS.length, label: i => PRON_CELLS[i].label, word: "verb" }
};
let mode = "words";
let index = 0;
let revealed = 0; // how many forms are shown for the current card

const el = id => document.getElementById(id);

function render() {
  const t = TABS[mode];
  const v = t.items[index];
  el("tab-words").classList.toggle("active", mode === "words");
  el("tab-rel").classList.toggle("active", mode === "rel");
  el("tab-time").classList.toggle("active", mode === "time");
  el("tab-pron").classList.toggle("active", mode === "pron");
  el("count").textContent = (mode === "pron" ? "Pronouns (verb forms from the data) - " : mode !== "words" ? `${v.g} - ` : "") + `${index + 1} / ${t.items.length}`;
  el("english").textContent = v.en;

  const rows = [];
  for (let i = 0; i < t.active; i++) {
    let deva, iast;
    if (mode === "pron") { const c = PRON_CELLS[i], w = v.f[c.k]; deva = c.d + " " + w[0]; iast = c.i + " " + w[1]; }
    else [deva, iast] = v.f[i];
    if (i < revealed) {
      rows.push(`<div class="form${mode === "rel" || mode === "time" ? " present" : ""}"><span class="label">${t.label(i)}</span><span class="deva">${deva}</span><span class="iast">${iast}</span></div>`);
    } else {
      // Question visible, answer hidden. Click the row or Show to reveal it.
      rows.push(`<div class="prompt" data-row="${i}"><span class="label">${t.label(i)}</span><span class="question">${v.en}</span><span class="answer-box">Say it, then Show</span></div>`);
    }
  }
  if (mode === "pron") PRON_NODATA.forEach(n => rows.push(`<div class="form"><span class="label">${n[0]}</span><span class="deva">${n[1]}</span><span class="iast">not in data</span></div>`));
  el("forms").innerHTML = rows.join("");
  el("forms").querySelectorAll(".prompt").forEach(p => p.addEventListener("click", () => {
    revealed = Math.max(revealed, Number(p.dataset.row) + 1); render();
  }));

  el("show").disabled = revealed >= t.active;
  el("show").innerHTML = revealed >= t.active
    ? '<span class="full">All forms shown</span><span class="short">All shown</span>'
    : '<span class="full">Show next form</span><span class="short">Show</span>';
  el("prev").disabled = index === 0;
  el("next").disabled = index === t.items.length - 1;
}

function showNext() { if (revealed < TABS[mode].active) { revealed++; render(); } }
function next() { if (index < TABS[mode].items.length - 1) { index++; revealed = 0; render(); } }
function prev() { if (index > 0) { index--; revealed = 0; render(); } }
function restart() { shuffle(TABS[mode].items); index = 0; revealed = 0; render(); }
function setMode(m) { mode = m; index = 0; revealed = 0; render(); }

el("show").addEventListener("click", showNext);
el("next").addEventListener("click", next);
el("prev").addEventListener("click", prev);
el("restart").addEventListener("click", restart);
el("tab-words").addEventListener("click", () => setMode("words"));
el("tab-rel").addEventListener("click", () => setMode("rel"));
el("tab-time").addEventListener("click", () => setMode("time"));
el("tab-pron").addEventListener("click", () => setMode("pron"));

document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); showNext(); }
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
});

shuffle(VERBS);
shuffle(RELS);
render();
</script>
