<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samskrutam">
<title>Samskrutam - Study</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; box-sizing: border-box; padding: 16px;
         background: #f4f6fa; font-family: "Segoe UI", system-ui, sans-serif; color: #1d2330; }
  .card { background: #fff; width: 100%; max-width: 760px; min-width: 0; box-sizing: border-box; height: calc(100vh - 32px); height: calc(100dvh - 32px); display: flex; flex-direction: column; border-radius: 14px; padding: 28px 26px;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center; }
  .count { color: #6b7385; font-size: 14px; margin-bottom: 14px; }
  .english { font-size: 38px; font-weight: 600; margin: 6px 0 18px; min-height: 2.6em; display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere; }
  .forms { text-align: left; margin-bottom: 18px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .form, .prompt { min-height: 64px; box-sizing: border-box; }
  .form { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) minmax(0, 1fr); align-items: baseline; gap: 12px;
          padding: 8px 12px; border-bottom: 1px solid #edf0f5; }
  .form .label { color: #6b7385; font-size: 16px; text-align: left; overflow-wrap: anywhere; }
  .form .deva { font-family: "Nirmala UI", "Noto Sans Devanagari", "Mangal", sans-serif; font-size: 32px; font-weight: 700; overflow-wrap: anywhere; }
  .form .iast { color: #3b6e3b; font-size: 20px; text-align: left; overflow-wrap: anywhere; }
  .form.present { background: #eef6ee; border-radius: 10px; padding: 14px 12px; border-bottom: 0; margin-bottom: 6px; }
  .form.present .label { font-weight: 700; color: #1d2330; font-size: 18px; }
  .form.present .deva { font-size: 40px; }
  .form.present .iast { font-size: 24px; font-weight: 700; }
  .prompt { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) minmax(0, 220px); align-items: center; gap: 12px; padding: 10px 12px;
            border-bottom: 1px solid #edf0f5; cursor: pointer; }
  .prompt .label { color: #1d2330; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .prompt .question { color: #1d2330; font-size: 17px; overflow-wrap: anywhere; }
  .prompt .answer-box { text-align: right; background: #fff7e0; border: 1px dashed #c9a227;
                        border-radius: 8px; padding: 6px 10px; color: #6b4e00; font-size: 17px; font-weight: 600; }
  .buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  button { font-size: 16px; padding: 10px 14px; min-width: 0; border: 0; border-radius: 8px; cursor: pointer;
           background: #e7ebf3; color: #1d2330; }
  button.primary { background: #2d6cdf; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(0.96); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1 1 120px; font-weight: 600; }
  .tabs button.active { background: #2d6cdf; color: #fff; }
  .short { display: none; }
  .hint { color: #8a92a3; font-size: 13px; margin-top: 16px; }
  @media (max-width: 600px) {
    body { padding: 0; }
    .card { height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; padding: 16px 12px; }
    .tabs, .count, .english, .buttons { flex: 0 0 auto; }
    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
    .buttons { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .tabs button, .buttons button { font-size: 13px; padding: 10px 2px; white-space: nowrap; }
    .full { display: none; }
    .short { display: inline; }
    .english { font-size: 26px; margin: 4px 0 10px; }
    .forms { flex: 1 1 0; min-height: 0; overflow-y: auto; margin-bottom: 12px; }
    .form, .prompt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 6px 8px; min-height: 72px; }
    .form .label, .prompt .label { flex: 0 1 auto; max-width: 48%; font-size: 14px; }
    .form .deva { flex: 1 1 40%; font-size: 26px; }
    .form .iast { flex: 1 1 100%; font-size: 17px; }
    .form.present { padding: 8px; }
    .form.present .label { font-size: 15px; }
    .form.present .deva { font-size: 30px; }
    .form.present .iast { font-size: 19px; }
    .prompt .question { flex: 1 1 40%; font-size: 15px; }
    .prompt .answer-box { flex: 1 1 100%; text-align: left; padding: 4px 8px; font-size: 15px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="tabs">
    <button id="tab-words" class="active">Words</button>
    <button id="tab-rel"><span class="full">Relationships</span><span class="short">Relations</span></button>
    <button id="tab-time">Time</button>
    <button id="tab-pron">Pronouns</button>
  </div>
  <div class="count" id="count"></div>
  <div class="english" id="english"></div>
  <div class="forms" id="forms"></div>
  <div class="buttons">
    <button id="prev"><span class="full">&larr; Previous</span><span class="short">&larr; Prev</span></button>
    <button class="primary" id="show"><span class="full">Show next form</span><span class="short">Show</span></button>

    <button id="restart"><span class="full">Restart</span><span class="short">Restart</span></button>
  </div>
  <div class="hint">Say each form aloud, then press Show for the next one. Keys: Space = Show next, &rarr; = Next card, &larr; = Previous card.</div>
</div>

<script>

// Fisher-Yates: random order, each verb exactly once per pass.
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const PRON_CELLS = [

  { label: "this, neuter (etat), imperative", d: "एतत्", i: "etat", k: 3 }
];
// Tabs share one card. Each tab has its own list and position.
const TABS = {
  words: { items: VERBS, active: ACTIVE_FORMS, label: i => FORM_LABELS[i], word: "verb" },
  rel:   { items: RELS,  active: 1,            label: i => "Sanskrit",     word: "term" },
  time:  { items: TIME,  active: 1,            label: i => "Sanskrit",     word: "term" },
  pron:  { items: VERBS, active: PRON_CELLS.length, label: i => PRON_CELLS[i].label, word: "verb" }
};
let mode = "words";
let index = 0;
let revealed = 0; // how many forms are shown for the current card

const el = id => document.getElementById(id);

function render() {
  const t = TABS[mode];
  const v = t.items[index];
  el("tab-words").classList.toggle("active", mode === "words");
  el("tab-rel").classList.toggle("active", mode === "rel");
  el("tab-time").classList.toggle("active", mode === "time");
  el("tab-pron").classList.toggle("active", mode === "pron");
  el("count").textContent = (mode === "pron" ? "Pronouns (verb forms from the data) - " : mode !== "words" ? `${v.g} - ` : "") + `${index + 1} / ${t.items.length}`;
  el("english").textContent = v.en;

  const rows = [];
  for (let i = 0; i < t.active; i++) {
    let deva, iast;
    if (mode === "pron") { const c = PRON_CELLS[i], w = v.f[c.k]; deva = c.d + " " + w[0]; iast = c.i + " " + w[1]; }
    else [deva, iast] = v.f[i];
    if (i < revealed) {
      rows.push(`<div class="form${mode === "rel" || mode === "time" ? " present" : ""}"><span class="label">${t.label(i)}</span><span class="deva">${deva}</span><span class="iast">${iast}</span></div>`);
    } else {
      // Question visible, answer hidden. Click the row or Show to reveal it.
      rows.push(`<div class="prompt" data-row="${i}"><span class="label">${t.label(i)}</span><span class="question">${v.en}</span><span class="answer-box">Say it, then Show</span></div>`);
    }
  }
  el("forms").innerHTML = rows.join("");
  el("forms").querySelectorAll(".prompt").forEach(p => p.addEventListener("click", () => {
    revealed = Math.max(revealed, Number(p.dataset.row) + 1); render();
  }));

  el("show").disabled = revealed >= t.active;
  el("show").innerHTML = revealed >= t.active
    ? '<span class="full">All forms shown</span><span class="short">All shown</span>'
    : '<span class="full">Show next form</span><span class="short">Show</span>';
  el("prev").disabled = index === 0;
  el("next").disabled = index === t.items.length - 1;
}

// The page never scrolls: the forms area scrolls inside the card. Back to its top on a tab or card change.
function keepTop() { el("forms").scrollTop = 0; }
function showNext() { if (revealed < TABS[mode].active) { revealed++; render(); } }
function next() { if (index < TABS[mode].items.length - 1) { index++; revealed = 0; render(); keepTop(); } }
function prev() { if (index > 0) { index--; revealed = 0; render(); keepTop(); } }
function restart() { shuffle(TABS[mode].items); index = 0; revealed = 0; render(); }
function setMode(m) { mode = m; index = 0; revealed = 0; render(); keepTop(); }

el("show").addEventListener("click", showNext);
el("next").addEventListener("click", next);
el("prev").addEventListener("click", prev);
el("restart").addEventListener("click", restart);
el("tab-words").addEventListener("click", () => setMode("words"));
el("tab-rel").addEventListener("click", () => setMode("rel"));
el("tab-time").addEventListener("click", () => setMode("time"));
el("tab-pron").addEventListener("click", () => setMode("pron"));

document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); showNext(); }
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
});

shuffle(VERBS);
shuffle(RELS);
render();
</script>
